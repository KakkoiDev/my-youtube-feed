<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyTube</title><meta name="theme-color" content="#161616">
<style>
*{box-sizing:border-box}body{margin:0;background:#161616;color:#eee;font:16px system-ui}header,main,nav{max-width:900px;margin:auto;padding:16px}header{display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:24px}small{color:#aaa}button,input,select{font:inherit;color:inherit;background:#252525;border:1px solid #444;border-radius:9px;padding:10px;margin:3px}button{cursor:pointer}button:hover,button.active{background:#444}button.primary{background:#eee;color:#111}input{max-width:100%}nav{position:sticky;bottom:0;background:#161616;display:flex;justify-content:space-around;flex-wrap:wrap;border-top:1px solid #333}article,.panel{background:#202020;border:1px solid #333;border-radius:14px;padding:16px;margin:12px 0}article h3{margin:8px 0}a{color:#ddd}img.avatar{width:44px;height:44px;border-radius:50%;vertical-align:middle}img.thumb{width:100%;display:block;border-radius:10px;max-height:380px;object-fit:contain}iframe{width:100%;aspect-ratio:16/9;border:0}iframe.short{aspect-ratio:9/16;max-height:70vh}label{display:block;margin-top:8px}#status{white-space:pre-wrap;color:#ffcf92}#view{min-height:65vh}.line{display:flex;align-items:center;flex-wrap:wrap;gap:6px}.grow{flex:1} .muted{color:#aaa}button:disabled{opacity:.5}
</style>
<header><div><h1>MyTube</h1><small>Your subscriptions. Your feed. Your attention.</small></div><button id="refresh">Refresh</button></header><main><div id="status" role="status"></div><section id="view"></section></main><nav id="nav"></nav>
<script type="module">
const $=s=>document.querySelector(s), view=$('#view'), status=$('#status');
const defaults=()=>({channels:[],collections:['Japanese AI','English AI'],videos:[],watched:[],saved:[]});
const db=await new Promise((ok,fail)=>{const r=indexedDB.open('mytube',1);r.onupgradeneeded=()=>r.result.createObjectStore('data');r.onsuccess=()=>ok(r.result);r.onerror=()=>fail(r.error)});
const read=()=>new Promise((ok,fail)=>{const r=db.transaction('data').objectStore('data').get('state');r.onsuccess=()=>ok(r.result||defaults());r.onerror=()=>fail(r.error)});
let state=await read(), key=localStorage.getItem('mytube-key')||'', filter='all', collection='All', unread=true, busy=false, playing=null, playerIndex=0;
const save=()=>new Promise((ok,fail)=>{const t=db.transaction('data','readwrite');t.objectStore('data').put(state,'state');t.oncomplete=ok;t.onerror=()=>fail(t.error)});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const validId=s=>/^[\w-]{11}$/.test(s), validChannel=s=>/^UC[\w-]{22}$/.test(s);
const api=async(resource,params)=>{if(!key)throw Error('Add your YouTube API key in Settings first.');const q=new URLSearchParams({...params,key});const r=await fetch('https://www.googleapis.com/youtube/v3/'+resource+'?'+q);const d=await r.json();if(!r.ok)throw Error(d.error?.message||'YouTube request failed');return d};
const duration=s=>{const m=/^PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/.exec(s||'');return m?+ (m[1]||0)*3600+ +(m[2]||0)*60+ +(m[3]||0):null};
const formatOf=v=>{const n=duration(v.contentDetails?.duration);return n===null?'unknown':n<=180?'short-candidate':'long'};
const route=()=>location.hash.slice(1).split('?')[0]||'feed';
function go(p){location.hash=p}
function options(items,selected){return items.map(x=>'<option '+(x===selected?'selected':'')+'>'+esc(x)+'</option>').join('')}
const formatOptions=f=>'<option value="all" '+(f==='all'?'selected':'')+'>All videos</option><option value="short-candidate" '+(f==='short-candidate'?'selected':'')+'>Short candidates (≤3 min)</option><option value="long" '+(f==='long'?'selected':'')+'>Long videos</option>';
function eligible(v){const c=state.channels.find(c=>c.id===v.channelId);return v.embeddable===true&&c&&!c.paused&&(collection==='All'||c.collection===collection)&&(c.format==='all'||c.format===v.format)&&(filter==='all'||filter===v.format)&&Date.parse(v.published)>=c.since&&(!unread||!state.watched.includes(v.id))}
function feed(){return state.videos.filter(eligible).sort((a,b)=>Date.parse(b.published)-Date.parse(a.published))}
function videoCard(v){return '<article><button class="play" data-play="'+esc(v.id)+'" style="padding:0;width:100%;border:0"><img class="thumb" loading="lazy" alt="" src="https://i.ytimg.com/vi/'+esc(v.id)+'/hqdefault.jpg"></button><h3>'+esc(v.title)+'</h3><small>'+esc(v.channelTitle)+' · '+esc(new Date(v.published).toLocaleDateString())+' · '+esc(v.format)+(v.embeddable===false?' · YouTube only':'')+'</small><div class="line"><button data-save="'+esc(v.id)+'">'+(state.saved.includes(v.id)?'★ Saved':'☆ Save')+'</button><button data-watch="'+esc(v.id)+'">'+(state.watched.includes(v.id)?'Mark unwatched':'Mark watched')+'</button><a target="_blank" rel="noopener" href="https://www.youtube.com/watch?v='+esc(v.id)+'">YouTube ↗</a></div></article>'}
function render(){const p=route();$('#nav').innerHTML=['feed','subscriptions','collections','saved','settings'].map(x=>'<button class="'+(p===x?'active':'')+'" data-route="'+x+'">'+x[0].toUpperCase()+x.slice(1)+'</button>').join('');
if(p==='feed'){const list=feed();view.innerHTML='<h2>Latest</h2><div class="line"><select id="collection">'+options(['All',...state.collections],collection)+'</select><select id="filter">'+formatOptions(filter)+'</select><label><input id="unread" type="checkbox" '+(unread?'checked':'')+'> Unwatched</label></div><small>'+list.length+' videos · newest first</small>'+list.map(videoCard).join('')+(list.length?'':'<div class="panel">'+(state.channels.length?"No matching cached videos. Refresh to check for new uploads.":"Subscribe to channels to begin.")+'</div>')}
else if(p==='subscriptions'){view.innerHTML='<h2>Subscriptions</h2><form id="add" class="panel"><label>YouTube channel URL or @handle</label><input name="channel" required placeholder="@rio-kigyo"><label>Collection</label><select name="collection">'+options(state.collections,state.collections[0])+'</select><label>Content</label><select name="format">'+formatOptions('all')+'</select><label>Include previous uploads</label><select name="days"><option value="7">Last 7 days</option><option value="30">Last 30 days</option><option value="0">Future only</option></select><button class="primary">Subscribe</button></form><button data-starter>Import Japanese AI starter (3 handles)</button><input id="search" placeholder="Find subscriptions">'+state.channels.map(c=>'<article class="channel" data-name="'+esc(c.title.toLowerCase())+'"><div class="line">'+(c.avatar?'<img class="avatar" alt="" src="'+esc(c.avatar)+'">':'')+'<b class="grow">'+esc(c.title)+'</b><button data-pause="'+c.id+'">'+(c.paused?'Resume':'Pause')+'</button></div><select data-move="'+c.id+'">'+options(state.collections,c.collection)+'</select><select data-format="'+c.id+'">'+formatOptions(c.format)+'</select><button data-remove="'+c.id+'">Unsubscribe</button></article>').join('')}
else if(p==='collections'){view.innerHTML='<h2>Collections</h2><form id="newcollection"><input name="name" required placeholder="New collection"><button>Add</button></form>'+state.collections.map(c=>'<article><b>'+esc(c)+'</b><p>'+state.channels.filter(x=>x.collection===c).length+' channels</p><button data-open="'+esc(c)+'">Open feed</button><button data-export="'+esc(c)+'">Export collection</button></article>').join('')}
else if(p==='saved'){view.innerHTML='<h2>Watch later</h2>'+state.videos.filter(v=>v.embeddable===true&&state.saved.includes(v.id)).map(videoCard).join('')}
else{view.innerHTML='<h2>Settings</h2><form id="key" class="panel"><label>YouTube Data API v3 key</label><input name="key" type="password" autocomplete="off" value="'+esc(key)+'"><button>Save key</button><p><a href="https://console.cloud.google.com/apis/credentials" target="_blank" rel="noopener">Create API key</a> · <a href="https://console.cloud.google.com/apis/library/youtube.googleapis.com" target="_blank" rel="noopener">Enable API</a></p><small>Stored on this device. Restrict to YouTube Data API and your hosting origin.</small></form><button data-backup>Export backup</button><label>Import backup or collection<input type="file" id="import" accept=".json,application/json"></label><small>Import merges subscriptions. API keys are never exported.</small>'}}
async function addChannel(input,group,format,days){let id=input.trim(),params={part:'snippet,contentDetails'};if(/^https?:/i.test(id)){const u=new URL(id);if(!['youtube.com','www.youtube.com','m.youtube.com'].includes(u.hostname))throw Error('Use a YouTube channel URL');const parts=u.pathname.split('/').filter(Boolean);id=parts[0]==='channel'?parts[1]:parts[0]||''}if(validChannel(id))params.id=id;else if(id.startsWith('@'))params.forHandle=id;else throw Error('Use @handle or /channel/UC… URL');const d=await api('channels',params),c=d.items?.[0];if(!c)throw Error('Channel not found: '+id);if(state.channels.some(x=>x.id===c.id))return;state.channels.push({id:c.id,title:c.snippet.title,avatar:c.snippet.thumbnails?.default?.url,uploads:c.contentDetails.relatedPlaylists.uploads,collection:group,format,since:Date.now()-Number(days)*86400000,paused:false});await save()}
async function refresh(){if(busy)return;busy=true;$('#refresh').disabled=true;let errors=[],count=0;try{for(const c of state.channels.filter(x=>!x.paused)){status.textContent='Refreshing '+c.title;try{let token,ids=[];for(let page=0;page<10;page++){const d=await api('playlistItems',{part:'contentDetails,snippet',playlistId:c.uploads,maxResults:50,...(token?{pageToken:token}:{})});for(const x of d.items||[]){if(validId(x.contentDetails.videoId))ids.push(x.contentDetails.videoId)}token=d.nextPageToken;if(!token||d.items?.some(x=>Date.parse(x.contentDetails.videoPublishedAt)<c.since))break}for(let i=0;i<ids.length;i+=50){const batch=ids.slice(i,i+50);const d=await api('videos',{part:'snippet,contentDetails,status',id:batch.join(',')});state.videos=state.videos.filter(y=>!batch.includes(y.id));for(const x of d.items||[]){if(x.snippet.channelId!==c.id||x.status.privacyStatus!=='public'||x.status.embeddable!==true||Date.parse(x.snippet.publishedAt)<c.since)continue;const v={id:x.id,title:x.snippet.title,channelId:c.id,channelTitle:c.title,published:x.snippet.publishedAt,format:formatOf(x),embeddable:x.status.embeddable===true};state.videos=state.videos.filter(y=>y.id!==v.id);state.videos.push(v);count++}}}catch(e){errors.push(c.title+': '+e.message)}}await save();status.textContent='Refresh complete: '+count+' uploads checked.'+(errors.length?'\n'+errors.join('\n'):'');render()}finally{busy=false;$('#refresh').disabled=false}}
function download(data,name){const u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
let playback=[];function play(id){playback=(route()==='saved'?state.videos.filter(v=>v.embeddable===true&&state.saved.includes(v.id)):feed()).map(v=>v.id);playerIndex=playback.indexOf(id);if(playerIndex<0)return;showPlayer()}
function showPlayer(){const id=playback[playerIndex],v=state.videos.find(x=>x.id===id);if(!v||v.embeddable!==true){playing=null;render();return}playing=id;view.innerHTML='<div class="line"><button data-close>← Feed</button><small>'+(playerIndex+1)+ ' / '+playback.length+'</small></div>'+(v.embeddable===false?'<div class="panel"><h3>Watch on YouTube</h3><p>The creator has disabled embedded playback.</p><a target="_blank" rel="noopener" href="https://www.youtube.com/watch?v='+id+'">Open video on YouTube ↗</a></div>':'<iframe class="'+(v.format==='short-candidate'?'short':'')+'" src="https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&rel=0&playsinline=1" title="'+esc(v.title)+'" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>')+'<h3>'+esc(v.title)+'</h3><div class="line"><button data-prev '+(playerIndex===0?'disabled':'')+'>Previous</button><button data-next>Watched & next</button><button data-save="'+id+'">'+(state.saved.includes(id)?'★ Saved':'☆ Save')+'</button><a href="https://www.youtube.com/watch?v='+id+'" target="_blank" rel="noopener">Open on YouTube</a></div>'}
async function next(){if(!playing)return;if(!state.watched.includes(playing))state.watched.push(playing);await save();playerIndex++;if(playerIndex>=playback.length){playing=null;view.innerHTML='<div class="panel">End of this feed.<button data-close>Back to feed</button></div>'}else showPlayer()}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;try{if(d.route){playing=null;go(d.route)}else if(d.play)play(d.play);else if('close'in d){playing=null;render()}else if('next'in d)await next();else if('prev'in d&&playerIndex>0){playerIndex--;showPlayer()}else if(d.save||d.watch){const k=d.save?'saved':'watched',id=d.save||d.watch;state[k]=state[k].includes(id)?state[k].filter(x=>x!==id):[...state[k],id];await save();if(playing)b.textContent=state.saved.includes(id)?'★ Saved':'☆ Save';else render()}else if(d.pause||d.remove){const c=state.channels.find(x=>x.id===(d.pause||d.remove));if(d.remove){if(!confirm('Unsubscribe from '+c.title+'?'))return;state.channels=state.channels.filter(x=>x!==c)}else c.paused=!c.paused;await save();render()}else if(d.open){collection=d.open;go('feed')}else if(d.export)download({collections:[d.export],channels:state.channels.filter(c=>c.collection===d.export)},'mytube-collection.json');else if('backup'in d)download(state,'mytube-backup.json');else if('starter'in d){if(busy)return;busy=true;try{let errs=[];for(const h of ['@rio-kigyo','@iketomo-ch','@AIHeadlineJP'])try{await addChannel(h,'Japanese AI','all',7)}catch(e){errs.push(h+': '+e.message)}status.textContent=errs.join('\n')||'Starter subscriptions added.';render()}finally{busy=false}}}catch(e){status.textContent=e.message}});
document.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);try{if(e.target.id==='add'){if(busy)return;busy=true;try{await addChannel(f.get('channel'),f.get('collection'),f.get('format'),f.get('days'));status.textContent='Subscribed. Refresh to fetch uploads.'}finally{busy=false}}else if(e.target.id==='key'){key=f.get('key').trim();localStorage.setItem('mytube-key',key);status.textContent='Key saved.'}else if(e.target.id==='newcollection'){const n=f.get('name').trim();if(n&&n!=='All'&&!state.collections.includes(n))state.collections.push(n);await save()}render()}catch(e){status.textContent=e.message}});
document.addEventListener('input',e=>{if(e.target.id==='search')document.querySelectorAll('.channel').forEach(x=>x.hidden=!x.dataset.name.includes(e.target.value.toLowerCase()))});
document.addEventListener('change',async e=>{const t=e.target;try{if(t.id==='collection')collection=t.value;else if(t.id==='filter')filter=t.value;else if(t.id==='unread')unread=t.checked;else if(t.dataset.move||t.dataset.format){const c=state.channels.find(x=>x.id===(t.dataset.move||t.dataset.format));c[t.dataset.move?'collection':'format']=t.value;await save()}else if(t.id==='import'){const d=JSON.parse(await t.files[0].text());if(!Array.isArray(d.channels)||!Array.isArray(d.collections))throw Error('Invalid backup');for(const g of d.collections)if(typeof g==='string'&&g!=='All'&&!state.collections.includes(g))state.collections.push(g);for(const c of d.channels){if(!validChannel(c.id)||!/^UU[\w-]{22}$/.test(c.uploads)||typeof c.title!=='string'||!state.collections.includes(c.collection)||!Number.isFinite(c.since)||!['all','long','short-candidate'].includes(c.format))continue;if(!state.channels.some(x=>x.id===c.id))state.channels.push({...c,avatar:typeof c.avatar==='string'&&c.avatar.startsWith('https://')?c.avatar:''})}for(const v of Array.isArray(d.videos)?d.videos:[])if(validId(v.id)&&state.channels.some(c=>c.id===v.channelId)&&typeof v.title==='string'&&Number.isFinite(Date.parse(v.published))&&!state.videos.some(x=>x.id===v.id))state.videos.push(v);for(const k of ['watched','saved'])if(Array.isArray(d[k]))state[k]=[...new Set([...state[k],...d[k].filter(validId)])];await save()}else return;render()}catch(e){status.textContent=e.message}});
let touchY=null;view.addEventListener('touchstart',e=>{touchY=e.changedTouches[0].clientY},{passive:true});view.addEventListener('touchend',e=>{if(!playing||touchY===null)return;const delta=e.changedTouches[0].clientY-touchY;touchY=null;if(delta<-70)next();if(delta>70&&playerIndex>0){playerIndex--;showPlayer()}},{passive:true});document.addEventListener('keydown',e=>{if(!playing||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowDown'){e.preventDefault();next()}if(e.key==='ArrowUp'&&playerIndex>0){e.preventDefault();playerIndex--;showPlayer()}});$('#refresh').onclick=()=>refresh().catch(e=>status.textContent=e.message);window.addEventListener('hashchange',()=>{playing=null;render()});render();if(!key&&!state.channels.length)go('settings');
</script></html>
