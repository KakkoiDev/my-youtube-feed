<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyTube</title><meta name="theme-color" content="#161616">
<style>
*{box-sizing:border-box}body{margin:0;background:#161616;color:#eee;font:16px system-ui}header,main,nav{max-width:900px;margin:auto;padding:16px}header{display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:24px}small{color:#aaa}button,input,select,textarea{font:inherit;color:inherit;background:#252525;border:1px solid #444;border-radius:9px;padding:10px;margin:3px}button{cursor:pointer}button:hover,button.active{background:#444}button.primary{background:#eee;color:#111}input{max-width:100%}textarea{display:block;width:100%;resize:vertical}nav{position:sticky;bottom:0;background:#161616;display:flex;justify-content:space-around;flex-wrap:wrap;border-top:1px solid #333}article,.panel{background:#202020;border:1px solid #333;border-radius:14px;padding:16px;margin:12px 0}article h3{margin:8px 0}a{color:#ddd}img.avatar{width:44px;height:44px;border-radius:50%;vertical-align:middle}img.thumb{width:100%;display:block;border-radius:10px;max-height:380px;object-fit:contain}iframe{width:100%;aspect-ratio:16/9;border:0}iframe.short{aspect-ratio:9/16;max-height:70vh}label{display:block;margin-top:8px}#status{white-space:pre-wrap;color:#ffcf92}#view{min-height:65vh}.line{display:flex;align-items:center;flex-wrap:wrap;gap:6px}.grow{flex:1} .muted{color:#aaa}button:disabled{opacity:.5}
</style>
<header><div><h1>MyTube</h1><small>Your subscriptions. Your feed. Your attention.</small></div><button id="refresh">Refresh</button></header><main><div id="status" role="status"></div><section id="view"></section></main><nav id="nav"></nav>
<script type="module" src="./app.mjs"></script></html>
